services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: tcc
      POSTGRES_PASSWORD: tcc
      POSTGRES_DB: tcc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.13
    environment:
      # Na CPU o Ollama calcula mal a memória livre e mantém vários LLMs carregados até o
      # runner ser morto por falta de memória: no máximo bge-m3 + um LLM, um pedido por vez.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      # O llama-server guarda em RAM o estado de cada prompt já visto (até 8 GiB, mais que a
      # VM): estoura a memória e faz a rodada seguinte, ou D depois de C, reaproveitar o prompt
      # idêntico. Desligado. Continua o reaproveitamento do prefixo comum com a chamada
      # imediatamente anterior (as instruções fixas), igual para B, C e D.
      LLAMA_ARG_CACHE_RAM: "0"
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
